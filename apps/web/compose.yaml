name: hachisky

networks:
  app-net:
    driver: bridge
  test-net:
    driver: bridge
    internal: true

volumes:
  pgdata: {}

services:
  db:
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: hachisky
      POSTGRES_USER: hachisky
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U hachisky -d hachisky"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app-net

  migrate:
    image: hachisky-web:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["node", "src/db/migrate.ts"]
    environment:
      APP_ENV: development
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: hachisky
      PGUSER: hachisky
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - app-net

  web:
    image: hachisky-web:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      APP_ENV: development
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: hachisky
      PGUSER: hachisky
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # The origin the browser uses. Better Auth trusts only this origin for
      # cookie-bearing POSTs, so open the app at 127.0.0.1, not localhost.
      BETTER_AUTH_URL: http://127.0.0.1:${HACHISKY_WEB_PORT:-3100}
      # Not `:?` — compose interpolates every service, so a required variable
      # would break the test profile and `up db`. Instead the web preflight
      # below exits 1 naming the missing key (never its value).
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
    # Validate the auth environment, then replace the shell with the server.
    command: ["sh", "-c", "node src/auth/check-auth-env-cli.ts && exec pnpm start"]
    ports:
      - "127.0.0.1:${HACHISKY_WEB_PORT:-3100}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      init-admin:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app-net

  # One-shot startup step: on a fresh installation it creates the default
  # administrator admin@ilasesorias.com with a random password written to
  # ./secrets/initial-admin-password (0600). Already initialized: exits 0 and
  # touches nothing. The password never goes through argv, env or logs. The
  # image runs as `node` (uid 1000), so ./secrets must be writable by uid 1000.
  # See README "Default administrator".
  init-admin:
    image: hachisky-web:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["node", "src/auth/default-admin-cli.ts"]
    environment:
      APP_ENV: development
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: hachisky
      PGUSER: hachisky
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BETTER_AUTH_URL: http://127.0.0.1:${HACHISKY_WEB_PORT:-3100}
      # Not `:?` (see bootstrap-admin). An empty value exits 1, so `web`,
      # which waits for this step, does not start.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      HACHISKY_SECRETS_DIR: /run/hachisky-secrets
    volumes:
      # `:Z` relabels the directory privately for SELinux hosts.
      - ./secrets:/run/hachisky-secrets:Z
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - app-net

  # One-shot operational task, only under the `ops` profile. Reads the admin
  # password from stdin (never argv or env). See README "Admin bootstrap".
  bootstrap-admin:
    profiles: ["ops"]
    image: hachisky-web:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    entrypoint: ["node", "src/auth/bootstrap-admin-cli.ts"]
    stdin_open: true
    environment:
      # `development` because this stack serves plain http on 127.0.0.1 (see
      # BETTER_AUTH_URL). A production APP_ENV would require an https URL.
      APP_ENV: development
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: hachisky
      PGUSER: hachisky
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BETTER_AUTH_URL: http://127.0.0.1:${HACHISKY_WEB_PORT:-3100}
      # Not `:?` — compose validates every service, so a required variable
      # here would break `up db web` and the test profile. An empty value makes
      # the CLI exit 1 (configuration error).
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - app-net

  db-test:
    profiles: ["test"]
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    command: ["postgres", "-c", "cluster_name=hachisky-test", "-c", "fsync=off"]
    environment:
      POSTGRES_DB: hachisky_test
      POSTGRES_USER: hachisky_test
      POSTGRES_PASSWORD: hachisky_test_disposable
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U hachisky_test -d hachisky_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test-net

  test:
    profiles: ["test"]
    image: hachisky-web-test:local
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    environment:
      APP_ENV: test
      PGHOST: db-test
      PGPORT: "5432"
      PGDATABASE: hachisky_test
      PGUSER: hachisky_test
      PGPASSWORD: hachisky_test_disposable
    depends_on:
      db-test:
        condition: service_healthy
    networks:
      - test-net
