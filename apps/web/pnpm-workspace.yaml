---
# Build-script policy for pnpm 12.18.0 `allowBuilds`, as written by
# `pnpm approve-builds esbuild`.
# Only esbuild may run install scripts; every other package stays blocked
# by default.
# Transitive versions pulled in by drizzle-kit 0.31.11, per pnpm-lock.yaml:
#   - esbuild 0.25.12  <- drizzle-kit 0.31.11
#   - esbuild 0.28.2   <- tsx 4.23.15 <- drizzle-kit 0.31.11
#   - esbuild 0.18.20  <- @esbuild-kit/core-utils 3.3.2 (deprecated)
#                         <- drizzle-kit 0.31.11
# Approved by the project owner on 2026-09-27 (U1).
# Version-specific release-age exceptions below preserve the requested exact
# stable Biome release while keeping future versions subject to pnpm policy.
allowBuilds:
  esbuild: true
overrides:
  esbuild@0.18.20: 0.25.12
  source-map-js@1.2.1: 1.2.2
minimumReleaseAgeExclude:
  - '@biomejs/biome@2.6.6'
  - '@biomejs/cli-android-arm64@2.6.6'
  - '@biomejs/cli-android-x64@2.6.6'
  - '@biomejs/cli-darwin-arm64@2.6.6'
  - '@biomejs/cli-darwin-x64@2.6.6'
  - '@biomejs/cli-linux-arm64-musl@2.6.6'
  - '@biomejs/cli-linux-arm64@2.6.6'
  - '@biomejs/cli-linux-x64-musl@2.6.6'
  - '@biomejs/cli-linux-x64@2.6.6'
  - '@biomejs/cli-win32-arm64@2.6.6'
  - '@biomejs/cli-win32-x64@2.6.6'
