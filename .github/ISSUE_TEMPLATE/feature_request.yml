name: Feature request
description: Propose an improvement or new capability
title: "feat: "
labels:
  - enhancement
  - status:needs-review
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: >-
            I understand this issue needs `status:approved` before a pull
            request can be opened.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: What problem or limitation should this feature address?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the desired behavior from the user's perspective.
    validations:
      required: true

  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      options:
        - Application
        - Authentication
        - Database
        - User interface
        - Documentation
        - CI / workflows
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe other approaches or workarounds you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, mockups, references, or other useful details.
